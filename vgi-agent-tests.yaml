# Private graders for the public vgi.agent_test_tasks in the worker's catalog metadata.
# `vgi-lint lint --ai` runs an agent on each prompt and grades it with check_sql.
# See https://github.com/Query-farm/vgi-lint-check (VGI920).
# The data is live (tsa.gov keeps adding days and weeks), so every grader is a check_sql that
# holds for both the offline fixture mirror (vgi-lint.toml) and live tsa.gov.
tasks:
  - name: busiest_day_2024
    check_sql: >-
      SELECT count(*) = 1 FROM tsa.main.daily_throughput
      WHERE date = DATE '2024-12-01' AND travelers = 3088836
  - name: latest_report_week
    check_sql: >-
      SELECT max(end_date) >= DATE '2026-11-07' AND max(end_date) - max(start_date) BETWEEN 4 AND 9
      FROM tsa.main.throughput_reports
  - name: atl_checkpoints
    check_sql: >-
      SELECT count(*) >= 2 AND sum(passengers) > 0
      FROM (SELECT checkpoint, sum(throughput) AS passengers
            FROM tsa.main.checkpoint_throughput(DATE '2026-11-01', DATE '2026-11-07', airport := 'ATL')
            GROUP BY checkpoint)
  - name: national_2019_vs_2025
    check_sql: >-
      SELECT sum(travelers) FILTER (WHERE year(date) = 2019) = 848102043
         AND sum(travelers) FILTER (WHERE year(date) = 2025) = 906735976
      FROM tsa.main.daily_throughput WHERE date BETWEEN DATE '2019-01-01' AND DATE '2025-12-31'
  - name: report_parse_quality
    check_sql: >-
      SELECT (SELECT count(*) FROM tsa.main.checkpoint_throughput_rejects(DATE '2026-11-01', DATE '2026-11-07')) = 0
         AND (SELECT count(*) FROM tsa.main.cache_info WHERE kind = 'checkpoint_report') >= 1
